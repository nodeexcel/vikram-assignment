<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Lexo Trading Decision System{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    nav { margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid #ccc; }
    nav a { margin-right: 1.25rem; text-decoration: none; color: #0645ad; }
    nav a:hover { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    code { font-size: 0.85em; word-break: break-all; }
    blockquote { border-left: 3px solid #999; margin: 0.5rem 0; padding: 0.25rem 0 0.25rem 1rem; color: #333; font-style: italic; }
    .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: bold; }
    .badge-derived { background: #e6f4ea; color: #0a7d2c; }
    .badge-partial { background: #fff4e0; color: #a15c00; }
    .badge-added { background: #fde8e8; color: #b00020; }
    .badge-unknown { background: #eee; color: #555; }
    .badge-internal { background: #e8eefc; color: #1a4fb0; }
    .badge-sector { background: #f2e8fc; color: #6b1ab0; }
    .badge-market { background: #fcefe8; color: #b0531a; }
    .source-cite { font-size: 0.85em; color: #555; }
    .match { color: #0a7d2c; font-weight: bold; }
    .mismatch { color: #b00020; font-weight: bold; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/research">What the research concludes</a>
    <a href="/rules">Rules &amp; sources</a>
    <a href="/timeline/guide_holds">Timeline</a>
    <a href="/determinism">Determinism check</a>
    <a href="/where-this-goes-next">Where this goes next</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
