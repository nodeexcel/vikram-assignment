# Render blueprint. Render builds the Dockerfile directly; it does not read
# docker-compose.yml (compose is local-only — see that file's header).
services:
  - name: lexo-trading-decision-system
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The Dockerfile's CMD binds 0.0.0.0 on $PORT, which Render injects and
    # defaults to 10000. No dockerCommand override is needed.
    #
    # Python version is pinned by the base image, so PYTHON_VERSION is not set
    # here — under the docker runtime it would have no effect and would only
    # mislead a reader into thinking it controlled anything.
    healthCheckPath: /health
    autoDeployTrigger: commit
